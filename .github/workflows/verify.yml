name: Verify app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci --prefix frontend
      - run: npm run android:sync --prefix frontend
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --console=plain
        working-directory: frontend/android
      - uses: actions/upload-artifact@v4
        with:
          name: Workflow-Calendar-Android-unsigned
          path: frontend/android/app/build/outputs/apk/release/*unsigned.apk
          retention-days: 14
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npm run i18n:check
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix desktop
      - run: npm test --prefix desktop
      - run: npm run dist --prefix desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Workflow-Calendar-Windows
          path: desktop/release/*.exe
          retention-days: 14
