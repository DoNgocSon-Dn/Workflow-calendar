<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Cùng hình logo với app-brand-logo (idle, không có ngày): thân trắng,
       viền + gáy + chữ W màu xanh thương hiệu #2563eb, đúng giá trị mặc định
       của biến accent trong styles.css. Favicon không đọc được biến CSS của
       trang nên màu phải ghim cứng ở đây.

       TUYỆT ĐỐI không viết hai dấu gạch ngang liền nhau trong comment này.
       SVG là XML, mà XML cấm chuỗi đó bên trong comment. Bản trước ghi tên
       biến CSS nguyên văn (có tiền tố hai gạch) nên cả file hỏng cú pháp,
       trình duyệt không dựng nổi ảnh và tab rơi về icon mặc định. -->
  <rect x="3.6" y="4.6" width="16.8" height="15.8" rx="2" fill="#fff" />
