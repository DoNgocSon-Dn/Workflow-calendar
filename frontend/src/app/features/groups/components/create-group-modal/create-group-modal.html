<div class="modal-backdrop" (click)="onBackdropClick($event)" role="dialog" aria-modal="true" aria-labelledby="create-group-modal-title">
  <div class="modal-card">
    <header class="modal-header">
      <h2 id="create-group-modal-title">{{ i18n.t('createGroup.title') }}</h2>
      <button type="button" class="btn-close" (click)="cancel()" [attr.aria-label]="i18n.t('common.close')">
        <app-icon name="close" />
      </button>
    </header>

    <div class="modal-body">
      <label class="field-label" for="group-name-input">{{ i18n.t('createGroup.nameLabel') }}</label>
      <input
        id="group-name-input"
        type="text"
        class="text-input"
        [placeholder]="i18n.t('createGroup.namePlaceholder')"
        maxlength="100"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
        (keydown.enter)="create()"
        autofocus
      />
      <app-char-counter class="field-counter" [current]="name().length" [max]="100" />

      <label class="field-label" for="group-desc-input">{{ i18n.t('createGroup.descLabel') }}</label>
      <textarea
        id="group-desc-input"
        class="text-area"
        [placeholder]="i18n.t('createGroup.descPlaceholder')"
        maxlength="500"
        [value]="description()"
        (input)="description.set($any($event.target).value)"
        rows="2"
      ></textarea>
      <app-char-counter class="field-counter" [current]="description().length" [max]="500" />

      <label class="field-label">{{ i18n.t('createGroup.colorLabel') }}</label>
      <div class="color-palette" role="radiogroup" [attr.aria-label]="i18n.t('createGroup.colorLabel')">
        @for (c of colors; track c) {
          <button
            type="button"
            class="color-dot"
            [class.selected]="color() === c"
            [attr.aria-label]="i18n.t('group.colorLabel', { color: c })"
            [style.background-color]="colorHex[c]"
            (click)="setColor(c)"
          ></button>
        }
      </div>

      <label class="approval-row">
        <input
          type="checkbox"
          [checked]="requiresApproval()"
          (change)="requiresApproval.set($any($event.target).checked)"
        />
        <span>
          <strong>{{ i18n.t('createGroup.requiresApproval') }}</strong>
          <span class="approval-hint">{{ i18n.t('createGroup.requiresApprovalHint') }}</span>
        </span>
      </label>

      @if (error(); as err) {
        <p class="error-msg" role="alert">{{ err }}</p>
      }
    </div>

    <footer class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">{{ i18n.t('common.cancel') }}</button>
      <button
        type="button"
        class="btn btn-primary"
        [disabled]="!name().trim() || creating()"
        (click)="create()"
      >
        @if (creating()) {
          {{ i18n.t('createGroup.creating') }}
        } @else {
          {{ i18n.t('createGroup.submit') }}
        }
      </button>
    </footer>
  </div>
</div>
