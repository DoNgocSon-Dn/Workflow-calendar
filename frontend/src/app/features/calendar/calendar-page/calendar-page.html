<div class="calendar-page">
  <app-calendar-header
    (openImport)="importModalOpen.set(true)"
    (openTrash)="trashModalOpen.set(true)"
    (openSettings)="settingsModalOpen.set(true)"
  />

  <div class="body">
    @if (store.sidebarOpen()) {
      <app-calendar-sidebar (createClicked)="openCreateBlank()" />
    }

    <main class="view-area">
      @switch (store.viewMode()) {
        @case ('month') {
          <app-month-view
            (createRequested)="openCreate($event)"
            (editRequested)="openEdit($event)"
          />
        }
        @case ('week') {
          <app-time-grid-view
            [days]="weekDays()"
            (createRequested)="openCreate($event)"
            (editRequested)="openEdit($event)"
          />
        }
        @case ('day') {
          <app-time-grid-view
            [days]="dayViewDays()"
            (createRequested)="openCreate($event)"
            (editRequested)="openEdit($event)"
          />
        }
        @case ('agenda') {
          <app-agenda-view (selectEvent)="onViewDetail($event)" />
        }
      }
    </main>
  </div>
</div>

@if (modalState(); as ms) {
  <app-event-form-modal
    [event]="ms.event"
    [defaultStart]="ms.defaultStart"
    [defaultEnd]="ms.defaultEnd"
    [defaultAllDay]="ms.defaultAllDay"
    [defaultTitle]="ms.defaultTitle"
    (closed)="closeModal()"
  />
}

@if (importModalOpen()) {
  <app-import-modal (closed)="importModalOpen.set(false)" />
}

@if (trashModalOpen()) {
  <app-trash-modal (closed)="trashModalOpen.set(false)" />
}

@if (settingsModalOpen()) {
  <app-settings-modal (closed)="settingsModalOpen.set(false)" />
}

<app-notification-popup (viewDetail)="onViewDetail($event)" />
<app-notes-widget />
<app-ai-chat-widget (openManualForm)="openManualFormFromAi($event)" />
