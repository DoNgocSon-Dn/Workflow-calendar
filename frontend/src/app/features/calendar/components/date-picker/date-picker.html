<button
  type="button"
  class="trigger"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="ariaLabel()"
  [disabled]="disabled()"
  (click)="toggleOpen()"
>
  <svg class="calendar-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
    <path
      fill="currentColor"
      d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zM5 9h14v11H5V9z"
    />
  </svg>
  <span class="value" [class.placeholder]="!displayLabel()">{{ displayLabel() || 'dd/mm/yyyy' }}</span>
</button>

@if (open()) {
  <div class="panel" role="dialog" [attr.aria-label]="ariaLabel()">
    <div class="panel-header">
      <button type="button" class="nav-btn" [attr.aria-label]="i18n.t('calendar.prevMonth')" (click)="prevMonth()">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <span class="month-label">{{ monthLabel() }}</span>
      <button type="button" class="nav-btn" [attr.aria-label]="i18n.t('calendar.nextMonth')" (click)="nextMonth()">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
      </button>
    </div>

    <div class="grid weekday-row">
      @for (wd of weekdayHeaders(); track wd) {
        <span class="weekday-cell">{{ wd }}</span>
      }
    </div>

    <div class="grid">
      @for (day of days(); track day.getTime()) {
        <button
          type="button"
          class="day-cell"
          [class.outside]="!isCurrentMonth(day)"
          [class.today]="isToday(day)"
          [class.selected]="isSelected(day)"
          (click)="selectDay(day)"
        >
          {{ day.getDate() }}
        </button>
      }
    </div>
  </div>
}
