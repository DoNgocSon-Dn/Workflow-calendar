<div class="backdrop" (click)="onBackdropClick($event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="create-calendar-modal-title">
    <header class="modal-header">
      <h2 id="create-calendar-modal-title">Tạo lịch nhóm mới</h2>
      <button type="button" class="icon-btn" aria-label="Đóng" (click)="cancel()">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor"
            d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
        </svg>
      </button>
    </header>

    <div class="modal-body">
      <label class="field">
        <span class="field-label">Tên lịch nhóm</span>
        <input
          type="text"
          class="field-input"
          placeholder="VD: Team Dự án, Gia đình..."
          maxlength="100"
          [value]="name()"
          (input)="name.set($any($event.target).value)"
          (keydown.enter)="create()"
        />
      </label>

      <div class="field">
        <span class="field-label">Màu</span>
        <div class="color-picker" role="radiogroup" aria-label="Màu lịch">
          @for (c of colors; track c) {
            <button
              type="button"
              role="radio"
              class="color-swatch"
              [class.active]="color() === c"
              [attr.aria-checked]="color() === c"
              [attr.aria-label]="c"
              [style.background]="colorHex[c]"
              (click)="setColor(c)"
            ></button>
          }
        </div>
      </div>

      @if (error()) {
        <p class="error-text">{{ error() }}</p>
      }

      <button
        type="button"
        class="send-btn"
        [disabled]="creating() || !name().trim()"
        (click)="create()"
      >
        {{ creating() ? 'Đang tạo...' : 'Tạo lịch' }}
      </button>
    </div>
  </div>
</div>
