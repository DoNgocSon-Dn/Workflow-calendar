<header class="topbar">
  <div class="left">
    <button
      type="button"
      class="icon-btn"
      [attr.aria-label]="i18n.t('header.toggleSidebar')"
      [title]="i18n.t('header.toggleSidebar')"
      (click)="toggleSidebar()"
    >
      <svg viewBox="0 0 24 24" width="22" height="22">
        <path
          fill="currentColor"
          d="M3 18h18v-2H3zm0-5h18v-2H3zm0-7v2h18V6z"
        />
      </svg>
    </button>
    <span class="brand">
      <app-brand-logo [dayNumber]="store.today().getDate()" />
    </span>
  </div>

  <div class="center">
    <button type="button" class="today-btn" (click)="store.goToday()">{{ i18n.t('common.today') }}</button>
    <button type="button" class="icon-btn" [attr.aria-label]="i18n.t('common.previous')" (click)="store.step(-1)">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
      </svg>
    </button>
    <button type="button" class="icon-btn" [attr.aria-label]="i18n.t('common.next')" (click)="store.step(1)">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z" />
      </svg>
    </button>
    <h1 class="period-label">{{ periodLabel() }}</h1>
  </div>

  <div class="right">
    <div class="search-box">
      <input
        type="text"
        class="search-input"
        [placeholder]="i18n.t('header.searchPlaceholder')"
        [value]="store.searchQuery()"
        (input)="store.setSearchQuery($any($event.target).value)"
      />
    </div>

    <button type="button" class="icon-btn" [attr.aria-label]="i18n.t('header.import')" [title]="i18n.t('header.import')" (click)="openImport.emit()">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z" />
      </svg>
    </button>

    <app-notification-button
      (openEvent)="onNotificationOpenEvent($event)"
      (openGroup)="onNotificationOpenGroup($event)"
    />

    <div class="view-menu">
      <button
        type="button"
        class="view-dropdown-btn"
        aria-haspopup="true"
        [attr.aria-expanded]="viewMenuOpen()"
        (click)="toggleViewMenu()"
      >
        {{ currentViewLabel() }}
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M7 10l5 5 5-5z" />
        </svg>
      </button>
      @if (viewMenuOpen()) {
        <div class="menu-backdrop" (click)="closeViewMenu()"></div>
        <div class="view-dropdown" role="menu">
          @for (v of viewModes; track v.mode) {
            <button
              type="button"
              role="menuitemradio"
              class="view-dropdown-item"
              [class.active]="store.viewMode() === v.mode"
              [attr.aria-checked]="store.viewMode() === v.mode"
              (click)="setViewMode(v.mode)"
            >
              {{ i18n.t(v.labelKey) }}
            </button>
          }
        </div>
      }
    </div>

    @if (userEmail()) {
      <div class="user-menu">
        <button
          type="button"
          class="avatar-btn"
          aria-haspopup="true"
          [attr.aria-expanded]="userMenuOpen()"
          [attr.aria-label]="displayName()"
          (click)="toggleUserMenu()"
        >
          @if (avatarUrl(); as avatar) {
            <img [src]="avatar" alt="" class="avatar-img" />
          } @else {
            {{ userInitial() }}
          }
        </button>
        @if (userMenuOpen()) {
          <div class="menu-backdrop" (click)="closeUserMenu()"></div>
          <div class="user-dropdown" role="menu">
            <p class="user-dropdown-name">{{ displayName() }}</p>
            @if (authStore.displayName()) {
              <p class="user-dropdown-email">{{ userEmail() }}</p>
            }
            <button type="button" class="dropdown-item" role="menuitem" (click)="openProfileFromMenu()">
              {{ i18n.t('header.settings') }}
            </button>
            <button type="button" class="dropdown-item" role="menuitem" (click)="logout()">
              {{ i18n.t('header.logout') }}
            </button>
          </div>
        }
      </div>
    }
  </div>
</header>
