<div class="backdrop" (click)="onBackdropClick($event)" role="dialog" aria-modal="true">
  <div
    class="card"
    [style.--holiday-bg]="theme().background"
    [style.--holiday-accent]="theme().accent"
    [style.--holiday-text]="theme().textColor"
    [style.--holiday-subtitle]="theme().subtitleColor"
  >
    <button type="button" class="close-btn" data-native-close (click)="close()" [attr.aria-label]="i18n.t('common.close')">✕</button>

    <span class="badge">{{ badgeLabel() }}</span>
    <app-holiday-visual class="holiday-art" [composition]="theme().composition" [theme]="theme()" aria-hidden="true" />
    <h2 class="title">{{ displayTitle() }}</h2>
    <p class="date">{{ dateDescription() || displayDate() }}</p>
    @if (subtitle()) { <p class="date">{{ subtitle() }}</p> }
    <p class="meta-line">
      {{ i18n.t('event.calendarType') }}: {{ calendarTypeLabel() }}
      &nbsp;•&nbsp;
      {{ i18n.t('event.sourceLabel') }}: {{ i18n.t('event.sourceSystem') }}
    </p>
  </div>
</div>
