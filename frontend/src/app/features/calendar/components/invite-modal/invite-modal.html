<div class="backdrop" (click)="onBackdropClick($event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="invite-modal-title">
    <header class="modal-header">
      <h2 id="invite-modal-title">{{ i18n.t('inviteModal.title', { name: calendarName() }) }}</h2>
      <button type="button" class="icon-btn" [attr.aria-label]="i18n.t('common.close')" (click)="cancel()">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor"
            d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
        </svg>
      </button>
    </header>

    <div class="modal-body">
      <label class="field">
        <span class="field-label">{{ i18n.t('inviteModal.emailLabel') }}</span>
        <input
          type="email"
          class="field-input"
          maxlength="254"
          placeholder="ban@example.com"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          (keydown.enter)="send()"
        />
      </label>

      <div class="field">
        <span class="field-label">{{ i18n.t('inviteModal.roleLabel') }}</span>
        <div class="segmented" role="radiogroup" [attr.aria-label]="i18n.t('inviteModal.roleLabel')">
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="role() === 'viewer'"
            [class.active]="role() === 'viewer'"
            (click)="setRole('viewer')"
          >
            {{ i18n.t('inviteModal.roleViewer') }}
          </button>
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="role() === 'editor'"
            [class.active]="role() === 'editor'"
            (click)="setRole('editor')"
          >
            {{ i18n.t('inviteModal.roleEditor') }}
          </button>
        </div>
      </div>

      @if (error()) {
        <p class="error-text">{{ error() }}</p>
      }
      @if (successEmail(); as sentTo) {
        <p class="success-text">{{ i18n.t('inviteModal.sent', { email: sentTo }) }}</p>
      }

      <button
        type="button"
        class="send-btn"
        [disabled]="sending() || !email().trim()"
        (click)="send()"
      >
        {{ sending() ? i18n.t('inviteModal.sending') : i18n.t('inviteModal.send') }}
      </button>
    </div>
  </div>
</div>
