<div class="comments-section">
  <span class="presets-label">{{ i18n.t('comments.label') }}</span>

  @if (comments().length > 0) {
    <ul class="comment-list">
      @for (c of comments(); track c.id) {
        <li class="comment-item">
          <span class="comment-content">{{ c.content }}</span>
          @if (c.userId === myUserId()) {
            <button
              type="button"
              class="comment-delete-btn"
              [attr.aria-label]="i18n.t('comments.delete')"
              (click)="remove(c.id)"
            >
              ×
            </button>
          }
        </li>
      }
    </ul>
  }

  <div class="row">
    <input
      class="text-input"
      type="text"
      maxlength="2000"
      [ngModel]="newComment()"
      (ngModelChange)="newComment.set($event)"
      [placeholder]="i18n.t('comments.placeholder')"
      (keydown.enter)="$event.preventDefault(); send()"
    />
    <app-char-counter [current]="newComment().length" [max]="2000" />
    <button type="button" class="text-btn" [disabled]="sending()" (click)="send()">
      {{ i18n.t('common.send') }}
    </button>
  </div>
</div>
