<div class="auth-page">
  <app-theme-toggle class="theme-toggle-corner" />
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="auth-title">Đăng ký</h1>

    @if (errorMessage()) {
      <p class="field-error">{{ errorMessage() }}</p>
    }
    @if (successMessage()) {
      <p class="field-success">{{ successMessage() }}</p>
    }

    <label class="field">
      <span class="field-label">Email</span>
      <input class="text-input" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <span class="field-error">Vui lòng nhập email hợp lệ.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Mật khẩu</span>
      <div class="password-field">
        <input
          class="text-input"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="toggle-password-btn"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          [attr.aria-pressed]="showPassword()"
        >
          @if (showPassword()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <span class="field-error">Mật khẩu cần ít nhất 6 ký tự.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Xác nhận mật khẩu</span>
      <div class="password-field">
        <input
          class="text-input"
          [type]="showConfirmPassword() ? 'text' : 'password'"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="toggle-password-btn"
          (click)="toggleConfirmPasswordVisibility()"
          [attr.aria-label]="showConfirmPassword() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          [attr.aria-pressed]="showConfirmPassword()"
        >
          @if (showConfirmPassword()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
      @if (form.errors?.['passwordMismatch'] && form.controls.confirmPassword.touched) {
        <span class="field-error">Mật khẩu xác nhận không khớp.</span>
      }
    </label>

    <button type="submit" class="primary-btn" [disabled]="submitting()">
      {{ submitting() ? 'Đang đăng ký…' : 'Đăng ký' }}
    </button>

    <p class="auth-footer">
      Đã có tài khoản? <a routerLink="/login">Đăng nhập</a>
    </p>
  </form>
</div>
