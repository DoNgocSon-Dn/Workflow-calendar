<div class="auth-page">
  <app-theme-toggle class="theme-toggle-corner" />
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="auth-title">Quên mật khẩu</h1>
    <p class="auth-subtitle">Nhập email của bạn, chúng tôi sẽ gửi liên kết đặt lại mật khẩu.</p>

    @if (errorMessage()) {
      <p class="field-error">{{ errorMessage() }}</p>
    }
    @if (successMessage()) {
      <p class="field-success">{{ successMessage() }}</p>
    }

    <label class="field">
      <span class="field-label">Email</span>
      <input class="text-input" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <span class="field-error">Vui lòng nhập email hợp lệ.</span>
      }
    </label>

    <button type="submit" class="primary-btn" [disabled]="submitting()">
      {{ submitting() ? 'Đang gửi…' : 'Gửi liên kết khôi phục' }}
    </button>

    <p class="auth-footer">
      <a routerLink="/login">Quay lại đăng nhập</a>
    </p>
  </form>
</div>
