<div class="auth-page">
  <app-theme-toggle class="theme-toggle-corner" />
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="auth-title">Đặt lại mật khẩu</h1>
    <p class="auth-subtitle">Nhập mật khẩu mới cho tài khoản của bạn.</p>

    @if (errorMessage()) {
      <p class="field-error">{{ errorMessage() }}</p>
    }
    @if (successMessage()) {
      <p class="field-success">{{ successMessage() }}</p>
    }

    <label class="field">
      <span class="field-label">Mật khẩu mới</span>
      <input
        class="text-input"
        type="password"
        formControlName="password"
        autocomplete="new-password"
      />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <span class="field-error">Mật khẩu cần ít nhất 6 ký tự.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Xác nhận mật khẩu</span>
      <input
        class="text-input"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
      />
      @if (form.errors?.['passwordMismatch'] && form.controls.confirmPassword.touched) {
        <span class="field-error">Mật khẩu xác nhận không khớp.</span>
      }
    </label>

    <button type="submit" class="primary-btn" [disabled]="submitting()">
      {{ submitting() ? 'Đang lưu…' : 'Đặt lại mật khẩu' }}
    </button>

    <p class="auth-footer">
      <a routerLink="/login">Quay lại đăng nhập</a>
    </p>
  </form>
</div>
