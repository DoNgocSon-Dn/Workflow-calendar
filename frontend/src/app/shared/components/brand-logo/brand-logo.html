<span class="bl" [attr.data-phase]="phase()">
  <span class="bl-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="26" height="26">
      <rect x="3" y="4" width="18" height="17" rx="2" fill="var(--holiday-accent, #1a73e8)" />
      <rect x="3" y="4" width="18" height="4" rx="2" fill="var(--holiday-accent-hover, #185abc)" />
      @if (dayNumber() !== null) {
        <text
          x="12"
          y="17"
          text-anchor="middle"
          font-size="9"
          fill="var(--holiday-accent-contrast, #fff)"
          font-weight="700"
        >
          {{ dayNumber() }}
        </text>
      } @else {
        <!-- Không có ngày để hiển thị (trang đăng nhập) thì mặt lịch mang chữ W.
             Vẽ bằng path chứ không dùng <text>: <text> phải chờ font tải xong nên
             sẽ thấy chữ nhảy cỡ, mà logo thì nằm ngay khung hình đầu tiên.

             TRẮNG CỨNG, KHÔNG dùng --holiday-accent-contrast như số ngày ở trên.
             Token đó là màu chữ-trên-nền-accent của giao diện, ở chế độ tối nó
             bằng #0b0d12 (gần đen) vì accent tối #3b82f6 quá sáng để đặt chữ
             trắng — hợp cho số ngày, nhưng bôi đen luôn chữ W. Chữ W là phần
             nhận diện thương hiệu, phải trắng y hệt logo bản vẽ tay ở landing
             page, nên nó không đi theo token giao diện. -->
        <path
          d="M7.6 11 9 16.8h1.6l1.4-3.6 1.4 3.6h1.6l1.4-5.8h-1.6l-.8 3.6-1.3-3.6h-1.4l-1.3 3.6-.8-3.6z"
          fill="#fff"
        />
      }
    </svg>
  </span>

  <span class="bl-word">
    <!-- Chữ đầu: chữ W duy nhất xuất hiện ở chặng 'mark'. -->
    <span class="bl-l bl-first">W</span>

    <!-- Sáu chữ giữa: o-r-k-f-l-o, hiện lần lượt ở chặng 'word'. -->
    @for (ch of middle; track $index) {
      <span class="bl-l bl-mid" [style.--i]="$index">{{ ch }}</span>
    }

    <!-- Chữ cuối: hai glyph chồng nhau để crossfade hoa → thường mà không
         phải thay text trong DOM (thay text sẽ giật khung hình). -->
    <span class="bl-l bl-last">
      <span class="bl-g bl-up" aria-hidden="true">W</span>
      <span class="bl-g bl-low" aria-hidden="true">w</span>
    </span>
  </span>

  <span class="bl-sr">Workflow</span>
</span>
