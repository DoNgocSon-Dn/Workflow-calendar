<div class="ldm-scene">
  <!-- Lớp 1: nền — silhouette nhà máy/cần cẩu, lưới kỹ thuật mờ, Gear A (lớn nhất) + Gear D (rất nhỏ). -->
  <svg class="ldm-layer ldm-layer--bg" viewBox="0 0 200 160" preserveAspectRatio="xMaxYMin meet" aria-hidden="true">
    <defs>
      <pattern [attr.id]="gridId" width="18" height="18" patternUnits="userSpaceOnUse">
        <path d="M18 0 H0 V18" fill="none" stroke="currentColor" stroke-width="0.5" />
      </pattern>
    </defs>

    <rect class="ldm-grid" x="0" y="0" width="200" height="160" [attr.fill]="'url(#' + gridId + ')'" />

    <g class="ldm-factory">
      <rect x="8" y="18" width="4" height="106" />
      <rect x="8" y="18" width="70" height="4" />
      <line x1="12" y1="22" x2="52" y2="46" />
      <polygon points="0,124 20,124 24,140 -4,140" />
      <rect x="150" y="70" width="3" height="54" />
      <rect x="126" y="70" width="27" height="3" />
    </g>

    <g class="ldm-float">
      <g
        class="ldm-gear ldm-gear--a ldm-gear--cw"
        [style.transform-origin]="gearA.cx + 'px ' + gearA.cy + 'px'"
      >
        <circle class="ldm-gear-body" [attr.cx]="gearA.cx" [attr.cy]="gearA.cy" [attr.r]="gearA.r" />
        <circle class="ldm-gear-rim" [attr.cx]="gearA.cx" [attr.cy]="gearA.cy" [attr.r]="gearA.r" />
        <circle
          class="ldm-gear-rim-hi"
          [attr.cx]="gearA.cx"
          [attr.cy]="gearA.cy - 1.4"
          [attr.r]="gearA.r - 2"
        />
        <rect
          class="ldm-gear-spoke"
          [attr.x]="gearA.cx - 2.4"
          [attr.y]="gearA.cy - gearA.r + 6"
          width="4.8"
          [attr.height]="gearA.r * 2 - 12"
          [attr.rx]="2"
        />
        <rect
          class="ldm-gear-spoke"
          [attr.x]="gearA.cx - 2.4"
          [attr.y]="gearA.cy - gearA.r + 6"
          width="4.8"
          [attr.height]="gearA.r * 2 - 12"
          [attr.rx]="2"
          [attr.transform]="'rotate(60 ' + gearA.cx + ' ' + gearA.cy + ')'"
        />
        <rect
          class="ldm-gear-spoke"
          [attr.x]="gearA.cx - 2.4"
          [attr.y]="gearA.cy - gearA.r + 6"
          width="4.8"
          [attr.height]="gearA.r * 2 - 12"
          [attr.rx]="2"
          [attr.transform]="'rotate(120 ' + gearA.cx + ' ' + gearA.cy + ')'"
        />
        <circle class="ldm-gear-hole" [attr.cx]="gearA.cx" [attr.cy]="gearA.cy" [attr.r]="gearA.r * 0.28" />
        @for (angle of gearA.teethAngles; track $index) {
          <rect
            class="ldm-gear-tooth"
            [attr.x]="gearA.cx - gearA.toothW / 2"
            [attr.y]="gearA.cy - gearA.r - gearA.toothH * 0.62"
            [attr.width]="gearA.toothW"
            [attr.height]="gearA.toothH"
            rx="1.4"
            [attr.transform]="'rotate(' + angle + ' ' + gearA.cx + ' ' + gearA.cy + ')'"
          />
        }
      </g>

      <g
        class="ldm-gear ldm-gear--d ldm-gear--ccw"
        [style.transform-origin]="gearD.cx + 'px ' + gearD.cy + 'px'"
      >
        <circle class="ldm-gear-body" [attr.cx]="gearD.cx" [attr.cy]="gearD.cy" [attr.r]="gearD.r" />
        <circle class="ldm-gear-hole" [attr.cx]="gearD.cx" [attr.cy]="gearD.cy" [attr.r]="gearD.r * 0.3" />
        @for (angle of gearD.teethAngles; track $index) {
          <rect
            class="ldm-gear-tooth"
            [attr.x]="gearD.cx - gearD.toothW / 2"
            [attr.y]="gearD.cy - gearD.r - gearD.toothH * 0.62"
            [attr.width]="gearD.toothW"
            [attr.height]="gearD.toothH"
            rx="1"
            [attr.transform]="'rotate(' + angle + ' ' + gearD.cx + ' ' + gearD.cy + ')'"
          />
        }
      </g>
    </g>

    <!-- Mũ bảo hộ — nền, dáng vòm đơn giản. Lớp ngoài đặt vị trí tĩnh bằng
         thuộc tính transform XML, lớp trong mới animate bằng CSS — SVG không
         cộng hai transform lại, CSS transform sẽ THAY THẾ hoàn toàn thuộc
         tính XML nếu animate cùng một phần tử (giống cách tet-branch-motif
         tách tet-branch-sway ra khỏi phần tử đặt vị trí). -->
    <g transform="translate(34, 96)">
      <g class="ldm-hardhat">
        <path d="M-16 6 A16 14 0 0 1 16 6 Z" />
        <rect x="-19" y="4" width="38" height="4.5" rx="2.2" />
      </g>
    </g>

    <!-- Bọc mỗi particle trong 1 <g> đặt góc nghiêng tĩnh bằng transform XML,
         hình vẽ bên trong mới animate bằng CSS transform (translate trôi) —
         cùng lý do tách lớp như mũ bảo hộ/cờ lê/búa ở trên. -->
    @for (p of bgParticles; track $index) {
      <g [attr.transform]="'rotate(' + p.rotate + ' ' + p.left * 2 + ' ' + p.top + ')'">
        @if (p.shape === 'square') {
          <rect
            class="ldm-particle ldm-particle--bg"
            [attr.x]="p.left * 2 - p.size / 2"
            [attr.y]="p.top - p.size / 2"
            [attr.width]="p.size"
            [attr.height]="p.size"
            [style.opacity]="p.opacity"
            [style.animation-duration.s]="p.duration"
            [style.animation-delay.s]="p.delay"
          />
        } @else {
          <line
            class="ldm-particle ldm-particle--bg"
            [attr.x1]="p.left * 2 - p.size / 2"
            [attr.y1]="p.top"
            [attr.x2]="p.left * 2 + p.size / 2"
            [attr.y2]="p.top"
            [style.opacity]="p.opacity"
            [style.animation-duration.s]="p.duration"
            [style.animation-delay.s]="p.delay"
          />
        }
      </g>
    }
  </svg>

  <!-- Lớp 2: giữa — Gear B (ăn khớp A, ngược chiều) + cờ lê. -->
  <svg class="ldm-layer ldm-layer--mid" viewBox="0 0 200 160" preserveAspectRatio="xMaxYMin meet" aria-hidden="true">
    <g class="ldm-float">
      <g
        class="ldm-gear ldm-gear--b ldm-gear--ccw"
        [style.transform-origin]="gearB.cx + 'px ' + gearB.cy + 'px'"
      >
        <circle class="ldm-gear-body" [attr.cx]="gearB.cx" [attr.cy]="gearB.cy" [attr.r]="gearB.r" />
        <circle class="ldm-gear-rim" [attr.cx]="gearB.cx" [attr.cy]="gearB.cy" [attr.r]="gearB.r" />
        <circle
          class="ldm-gear-rim-hi"
          [attr.cx]="gearB.cx"
          [attr.cy]="gearB.cy - 1.1"
          [attr.r]="gearB.r - 1.6"
        />
        <circle class="ldm-gear-hole" [attr.cx]="gearB.cx" [attr.cy]="gearB.cy" [attr.r]="gearB.r * 0.3" />
        @for (angle of gearB.teethAngles; track $index) {
          <rect
            class="ldm-gear-tooth"
            [attr.x]="gearB.cx - gearB.toothW / 2"
            [attr.y]="gearB.cy - gearB.r - gearB.toothH * 0.62"
            [attr.width]="gearB.toothW"
            [attr.height]="gearB.toothH"
            rx="1.2"
            [attr.transform]="'rotate(' + angle + ' ' + gearB.cx + ' ' + gearB.cy + ')'"
          />
        }
      </g>
    </g>

    <!-- Cờ lê — nghiêng chéo, đầu mở hai bên. -->
    <g transform="translate(150, 130) rotate(-30)">
      <g class="ldm-wrench">
        <rect x="-3" y="-22" width="6" height="34" rx="2.4" />
        <path d="M-9 -30 Q0 -38 9 -30 L6 -20 Q0 -25 -6 -20 Z" />
        <path d="M-8 8 Q0 16 8 8 L8 18 Q0 24 -8 18 Z" />
      </g>
    </g>

    @for (p of midParticles; track $index) {
      <g [attr.transform]="'rotate(' + p.rotate + ' ' + p.left * 2 + ' ' + p.top + ')'">
        @if (p.shape === 'square') {
          <rect
            class="ldm-particle ldm-particle--mid"
            [attr.x]="p.left * 2 - p.size / 2"
            [attr.y]="p.top - p.size / 2"
            [attr.width]="p.size"
            [attr.height]="p.size"
            [style.opacity]="p.opacity"
            [style.animation-duration.s]="p.duration"
            [style.animation-delay.s]="p.delay"
          />
        } @else {
          <line
            class="ldm-particle ldm-particle--mid"
            [attr.x1]="p.left * 2 - p.size / 2"
            [attr.y1]="p.top"
            [attr.x2]="p.left * 2 + p.size / 2"
            [attr.y2]="p.top"
            [style.opacity]="p.opacity"
            [style.animation-duration.s]="p.duration"
            [style.animation-delay.s]="p.delay"
          />
        }
      </g>
    }
  </svg>

  <!-- Lớp 3: tiền cảnh — Gear C (ăn khớp B, cùng chiều A) + búa. -->
  <svg class="ldm-layer ldm-layer--fg" viewBox="0 0 200 160" preserveAspectRatio="xMaxYMin meet" aria-hidden="true">
    <g class="ldm-float">
      <g
        class="ldm-gear ldm-gear--c ldm-gear--cw"
        [style.transform-origin]="gearC.cx + 'px ' + gearC.cy + 'px'"
      >
        <circle class="ldm-gear-body" [attr.cx]="gearC.cx" [attr.cy]="gearC.cy" [attr.r]="gearC.r" />
        <circle class="ldm-gear-hole" [attr.cx]="gearC.cx" [attr.cy]="gearC.cy" [attr.r]="gearC.r * 0.32" />
        @for (angle of gearC.teethAngles; track $index) {
          <rect
            class="ldm-gear-tooth"
            [attr.x]="gearC.cx - gearC.toothW / 2"
            [attr.y]="gearC.cy - gearC.r - gearC.toothH * 0.62"
            [attr.width]="gearC.toothW"
            [attr.height]="gearC.toothH"
            rx="1"
            [attr.transform]="'rotate(' + angle + ' ' + gearC.cx + ' ' + gearC.cy + ')'"
          />
        }
      </g>
    </g>

    <!-- Búa — cán chéo, đầu búa hình chữ nhật bo góc. -->
    <g transform="translate(56, 44) rotate(18)">
      <g class="ldm-hammer">
        <rect x="-2.6" y="-4" width="5.2" height="46" rx="2.4" />
        <rect x="-15" y="-16" width="30" height="16" rx="3" />
      </g>
    </g>

    @for (p of fgParticles; track $index) {
      <g [attr.transform]="'rotate(' + p.rotate + ' ' + p.left * 2 + ' ' + p.top + ')'">
        @if (p.shape === 'square') {
          <rect
            class="ldm-particle ldm-particle--fg"
            [attr.x]="p.left * 2 - p.size / 2"
            [attr.y]="p.top - p.size / 2"
            [attr.width]="p.size"
            [attr.height]="p.size"
            [style.opacity]="p.opacity"
            [style.animation-duration.s]="p.duration"
            [style.animation-delay.s]="p.delay"
          />
        } @else {
          <line
            class="ldm-particle ldm-particle--fg"
            [attr.x1]="p.left * 2 - p.size / 2"
            [attr.y1]="p.top"
            [attr.x2]="p.left * 2 + p.size / 2"
            [attr.y2]="p.top"
            [style.opacity]="p.opacity"
            [style.animation-duration.s]="p.duration"
            [style.animation-delay.s]="p.delay"
          />
        }
      </g>
    }
  </svg>
</div>
