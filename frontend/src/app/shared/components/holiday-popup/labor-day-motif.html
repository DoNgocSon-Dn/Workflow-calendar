<div class="ldm-scene">
  <!-- Lớp 1: nền — lưới kỹ thuật + silhouette nhà máy/cần cẩu rất mờ (chỉ tạo
       chiều sâu) + particle "bụi xưởng". -->
  <svg class="ldm-layer ldm-layer--bg" viewBox="0 0 200 160" preserveAspectRatio="xMaxYMin meet" aria-hidden="true">
    <defs>
      <pattern [attr.id]="gridId" width="18" height="18" patternUnits="userSpaceOnUse">
        <path d="M18 0 H0 V18" fill="none" stroke="currentColor" stroke-width="0.5" />
      </pattern>
    </defs>

    <rect class="ldm-grid" x="0" y="0" width="200" height="160" [attr.fill]="'url(#' + gridId + ')'" />

    <g class="ldm-factory">
      <rect x="8" y="18" width="4" height="106" />
      <rect x="8" y="18" width="70" height="4" />
      <line x1="12" y1="22" x2="52" y2="46" />
      <polygon points="0,124 20,124 24,140 -4,140" />
      <rect x="150" y="70" width="3" height="54" />
      <rect x="126" y="70" width="27" height="3" />
    </g>

    @for (p of bgParticles; track $index) {
      <g [attr.transform]="'rotate(' + p.rotate + ' ' + p.left * 2 + ' ' + p.top + ')'">
        @if (p.shape === 'square') {
          <rect
            class="ldm-particle ldm-particle--bg"
            [attr.x]="p.left * 2 - p.size / 2"
            [attr.y]="p.top - p.size / 2"
            [attr.width]="p.size"
            [attr.height]="p.size"
            [style.opacity]="p.opacity"
            [style.animation-duration.s]="p.duration"
            [style.animation-delay.s]="p.delay"
          />
        } @else {
          <line
            class="ldm-particle ldm-particle--bg"
            [attr.x1]="p.left * 2 - p.size / 2"
            [attr.y1]="p.top"
            [attr.x2]="p.left * 2 + p.size / 2"
            [attr.y2]="p.top"
            [style.opacity]="p.opacity"
            [style.animation-duration.s]="p.duration"
            [style.animation-delay.s]="p.delay"
          />
        }
      </g>
    }
  </svg>

  <svg class="ldm-layer ldm-layer--mid" viewBox="0 0 200 160" preserveAspectRatio="xMaxYMin meet" aria-hidden="true">
    <g class="ldm-gear-float">
      <!-- Bánh răng vector tối giản + hoạ tiết kỷ niệm 1/5 & 30/4 sang trọng (đặt giữa) -->
      <g class="ldm-gear-assembly" transform="translate(100, 80)">
        <!-- Vòng tia phát sáng -->
        <circle cx="0" cy="0" r="46" fill="none" stroke="currentColor" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.3" />
        <!-- Bánh răng chính bánh răng kỹ nghệ -->
        <g class="ldm-gear-spin">
          <circle cx="0" cy="0" r="32" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4" />
          <circle cx="0" cy="0" r="22" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3" />
          <path d="M-4,-38 H4 V-30 H-4 Z M-4,30 H4 V38 H-4 Z M-38,-4 V4 H-30 V-4 Z M30,-4 V4 H38 V-4 Z M-26,-26 L-20,-20 L-15,-25 L-21,-31 Z M20,20 L26,26 L31,21 L25,15 Z M-26,26 L-20,20 L-25,15 L-31,21 Z M20,-20 L26,-26 L21,-31 L15,-25 Z" fill="currentColor" opacity="0.35" />
          <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="currentColor" opacity="0.5" />
        </g>
      </g>
    </g>

    @for (p of midParticles; track $index) {
      <g [attr.transform]="'rotate(' + p.rotate + ' ' + p.left * 2 + ' ' + p.top + ')'">
        @if (p.shape === 'square') {
          <rect
            class="ldm-particle ldm-particle--mid"
            [attr.x]="p.left * 2 - p.size / 2"
            [attr.y]="p.top - p.size / 2"
            [attr.width]="p.size"
            [attr.height]="p.size"
            [style.opacity]="p.opacity"
            [style.animation-duration.s]="p.duration"
            [style.animation-delay.s]="p.delay"
          />
        } @else {
          <line
            class="ldm-particle ldm-particle--mid"
            [attr.x1]="p.left * 2 - p.size / 2"
            [attr.y1]="p.top"
            [attr.x2]="p.left * 2 + p.size / 2"
            [attr.y2]="p.top"
            [style.opacity]="p.opacity"
            [style.animation-duration.s]="p.duration"
            [style.animation-delay.s]="p.delay"
          />
        }
      </g>
    }
  </svg>

  <!-- Lớp 3: tiền cảnh — chỉ particle bụi bay gần, không vật thể nặng (spec:
       tối giản, lịch luôn đọc được). -->
  <svg class="ldm-layer ldm-layer--fg" viewBox="0 0 200 160" preserveAspectRatio="xMaxYMin meet" aria-hidden="true">
    @for (p of fgParticles; track $index) {
      <g [attr.transform]="'rotate(' + p.rotate + ' ' + p.left * 2 + ' ' + p.top + ')'">
        @if (p.shape === 'square') {
          <rect
            class="ldm-particle ldm-particle--fg"
            [attr.x]="p.left * 2 - p.size / 2"
            [attr.y]="p.top - p.size / 2"
            [attr.width]="p.size"
            [attr.height]="p.size"
            [style.opacity]="p.opacity"
            [style.animation-duration.s]="p.duration"
            [style.animation-delay.s]="p.delay"
          />
        } @else {
          <line
            class="ldm-particle ldm-particle--fg"
            [attr.x1]="p.left * 2 - p.size / 2"
            [attr.y1]="p.top"
            [attr.x2]="p.left * 2 + p.size / 2"
            [attr.y2]="p.top"
            [style.opacity]="p.opacity"
            [style.animation-duration.s]="p.duration"
            [style.animation-delay.s]="p.delay"
          />
        }
      </g>
    }
  </svg>
</div>
