<div class="ldm-scene">
  <!-- Lớp 1: dải cờ đỏ phấp phới mềm mại phía sau -->
  <svg class="ldm-layer ldm-layer--bg" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs>
      <linearGradient id="ldmFlagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ef4444" />
        <stop offset="60%" stop-color="#dc2626" />
        <stop offset="100%" stop-color="#991b1b" />
      </linearGradient>
      <linearGradient id="ldmGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a" />
        <stop offset="50%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#d97706" />
      </linearGradient>
    </defs>

    <!-- Dải ruy băng cờ đỏ phấp phới -->
    <path class="ldm-flag-wave" d="M 15,95 Q 60,60 100,88 T 185,70" fill="none" stroke="url(#ldmFlagGrad)" stroke-width="22" stroke-linecap="round" opacity="0.32" />
  </svg>

  <!-- Lớp 2: Biểu tượng chính 1/5 & 30/4 — Bánh răng Công nhân + Bông lúa Nông dân + Sao vàng Tổ Quốc -->
  <svg class="ldm-layer ldm-layer--mid" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <g class="ldm-main-symbol" transform="translate(100, 80)">

      <!-- Bánh răng Công nghiệp (Kỹ nghệ lao động) xoay chậm -->
      <g class="ldm-gear-spin">
        <circle cx="0" cy="0" r="30" fill="none" stroke="url(#ldmGoldGrad)" stroke-width="2" opacity="0.65" />
        <circle cx="0" cy="0" r="22" fill="none" stroke="url(#ldmGoldGrad)" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
        
        <!-- Các răng của bánh răng công nghiệp (Rõ nét 100%) -->
        <g fill="url(#ldmGoldGrad)" opacity="0.8">
          <rect x="-3" y="-35" width="6" height="8" rx="1" />
          <rect x="-3" y="27" width="6" height="8" rx="1" />
          <rect x="-35" y="-3" width="8" height="6" rx="1" />
          <rect x="27" y="-3" width="8" height="6" rx="1" />
          <g transform="rotate(45)">
            <rect x="-3" y="-35" width="6" height="8" rx="1" />
            <rect x="-3" y="27" width="6" height="8" rx="1" />
            <rect x="-35" y="-3" width="8" height="6" rx="1" />
            <rect x="27" y="-3" width="8" height="6" rx="1" />
          </g>
        </g>
      </g>

      <!-- Vòng Bông Lúa Vàng 2 bên (Công - Nông liên minh) -->
      <g stroke="url(#ldmGoldGrad)" fill="url(#ldmGoldGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.75">
        <!-- Vòng lúa bên trái -->
        <path d="M -10,22 C -28,16 -36,-4 -30,-24" fill="none" />
        <circle cx="-22" cy="12" r="2.2" />
        <circle cx="-29" cy="2" r="2.2" />
        <circle cx="-31" cy="-10" r="2.2" />
        <circle cx="-27" cy="-21" r="2" />

        <!-- Vòng lúa bên phải -->
        <path d="M 10,22 C 28,16 36,-4 30,-24" fill="none" />
        <circle cx="22" cy="12" r="2.2" />
        <circle cx="29" cy="2" r="2.2" />
        <circle cx="31" cy="-10" r="2.2" />
        <circle cx="27" cy="-21" r="2" />
      </g>

      <!-- Ngôi Sao Vàng 5 Cánh chính giữa (Rõ nét, nổi bật) -->
      <polygon
        class="ldm-star-gold"
        points="0,-18 5.3,-5.5 17.1,-5.5 7.6,2.2 11.2,14.5 0,6.8 -11.2,14.5 -7.6,2.2 -17.1,-5.5 -5.3,-5.5"
        fill="url(#ldmGoldGrad)"
        opacity="0.95"
        filter="drop-shadow(0 2px 8px rgba(217, 119, 6, 0.4))"
      />
    </g>
  </svg>

  <!-- Lớp 3: Chim bồ câu hòa bình bay chao nghiêng + Hạt sao lấp lánh -->
  <svg class="ldm-layer ldm-layer--fg" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <!-- Chim bồ câu hòa bình bay bên trái -->
    <g class="ldm-dove-fly" transform="translate(42, 38) scale(0.42)">
      <path d="M 0,0 C 8,-12 24,-16 36,-8 C 30,-2 22,2 14,4 C 24,10 32,20 28,28 C 18,24 10,16 4,8 C -2,12 -8,14 -16,12 C -8,6 -4,2 0,0 Z" fill="#ffffff" opacity="0.85" />
    </g>
    <!-- Chim bồ câu hòa bình bay bên phải -->
    <g class="ldm-dove-fly ldm-dove-fly--slow" transform="translate(148, 34) scale(0.35)">
      <path d="M 0,0 C 8,-12 24,-16 36,-8 C 30,-2 22,2 14,4 C 24,10 32,20 28,28 C 18,24 10,16 4,8 C -2,12 -8,14 -16,12 C -8,6 -4,2 0,0 Z" fill="#ffffff" opacity="0.75" />
    </g>

    <!-- Ngôi sao nhỏ lấp lánh nhẹ nhàng -->
    @for (p of midParticles; track $index) {
      <polygon
        class="ldm-sparkle"
        points="0,-4 1.2,-1.2 4,0 1.2,1.2 0,4 -1.2,1.2 -4,0 -1.2,-1.2"
        fill="#fbbf24"
        [attr.transform]="'translate(' + (p.left * 1.8 + 10) + ',' + p.top + ') scale(' + (p.size / 6) + ')'"
        [style.opacity]="p.opacity * 0.7"
        [style.animation-duration.s]="p.duration"
        [style.animation-delay.s]="p.delay"
      />
    }
  </svg>
</div>
