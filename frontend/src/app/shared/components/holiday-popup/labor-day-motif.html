<div class="ldm-scene">
  <!-- Lớp 1: Hào quang tỏa sáng & các tia nắng xoay đằng sau nón công nhân -->
  <svg class="ldm-layer ldm-layer--bg" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs>
      <!-- Gradient hào quang tỏa sáng -->
      <radialGradient id="ldmHaloGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45" />
        <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.2" />
        <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
      </radialGradient>
      
      <!-- Gradient nón công nhân -->
      <linearGradient id="ldmHelmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a" />
        <stop offset="35%" stop-color="#f59e0b" />
        <stop offset="85%" stop-color="#d97706" />
        <stop offset="100%" stop-color="#b45309" />
      </linearGradient>

      <!-- Gradient ánh sáng bóng nón -->
      <linearGradient id="ldmHelmetHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      </linearGradient>
    </defs>

    <!-- Vòng hào quang tỏa sáng nhịp thở đằng sau nón -->
    <circle class="ldm-halo-glow" cx="120" cy="85" r="72" fill="url(#ldmHaloGlow)" />

    <!-- Tia hào quang xoay tròn đằng sau nón công nhân -->
    <g class="ldm-halo-spin" transform="translate(120, 85)">
      <g opacity="0.35" fill="#f59e0b">
        <polygon points="0,0 -8,-90 8,-90" />
        <polygon points="0,0 -8,90 8,90" />
        <polygon points="0,0 -90,-8 -90,8" />
        <polygon points="0,0 90,-8 90,8" />
        <polygon points="0,0 -65,-65 -53,-75" />
        <polygon points="0,0 65,65 53,75" />
        <polygon points="0,0 -65,65 -75,53" />
        <polygon points="0,0 65,-65 75,-53" />
      </g>
    </g>
  </svg>

  <!-- Lớp 2: Mũ / Nón Công Nhân Lao Động chính giữa -->
  <svg class="ldm-layer ldm-layer--mid" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <g class="ldm-helmet-group" transform="translate(120, 85)">
      <!-- Bóng đổ dưới nón -->
      <ellipse cx="0" cy="36" rx="48" ry="10" fill="#000000" opacity="0.25" filter="blur(4px)" />

      <!-- Vòm nón công nhân -->
      <path
        d="M -42,12 C -42,-22 -26,-36 0,-36 C 26,-36 42,-12 42,12 Z"
        fill="url(#ldmHelmetGrad)"
        stroke="#78350f"
        stroke-width="1.5"
      />

      <!-- Vành nón rộng phía trước -->
      <path
        d="M -50,14 C -30,22 30,22 50,14 C 54,20 46,26 0,26 C -46,26 -54,20 -50,14 Z"
        fill="url(#ldmHelmetGrad)"
        stroke="#78350f"
        stroke-width="1.5"
      />

      <!-- Gờ dọc sống nón -->
      <path
        d="M -5,-35 C -1,-36 1,-36 5,-35 L 4,18 C 1,20 -1,20 -4,18 Z"
        fill="url(#ldmHelmetHighlight)"
        opacity="0.7"
      />

      <!-- Vệt phản chiếu ánh sáng -->
      <path
        d="M -32,-8 C -22,-26 -10,-32 -4,-33 C -14,-28 -24,-18 -28,-4 Z"
        fill="#ffffff"
        opacity="0.45"
      />

      <!-- Ngôi sao vàng trên trán nón công nhân -->
      <polygon
        points="0,-8 2.5,-2 8.5,-2 3.8,1.8 5.5,7.5 0,3.8 -5.5,7.5 -3.8,1.8 -8.5,-2 -2.5,-2"
        fill="#fef08a"
        stroke="#b45309"
        stroke-width="0.8"
        filter="drop-shadow(0 1px 3px rgba(0,0,0,0.3))"
      />
    </g>
  </svg>

  <!-- Lớp 3: Hạt lấp lánh nhẹ nhàng -->
  <svg class="ldm-layer ldm-layer--fg" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    @for (p of midParticles; track $index) {
      <polygon
        class="ldm-sparkle"
        points="0,-4 1.2,-1.2 4,0 1.2,1.2 0,4 -1.2,1.2 -4,0 -1.2,-1.2"
        fill="#fbbf24"
        [attr.transform]="'translate(' + (p.left * 2.2 + 10) + ',' + (p.top * 1.2) + ') scale(' + (p.size / 6) + ')'"
        [style.opacity]="p.opacity * 0.7"
        [style.animation-duration.s]="p.duration"
        [style.animation-delay.s]="p.delay"
      />
    }
  </svg>
</div>
