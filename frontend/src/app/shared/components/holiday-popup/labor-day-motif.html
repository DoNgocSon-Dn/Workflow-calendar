<div class="ldm-scene">
  <!-- Lớp 1: Hào quang & Nền kỹ thuật xưởng cơ khí -->
  <svg class="ldm-layer ldm-layer--bg" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs>
      <!-- Radial glow nền -->
      <radialGradient id="ldmProfGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55" />
        <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.25" />
        <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
      </radialGradient>

      <!-- 1. Thép không gỉ 3D Metallic (Stainless Steel) -->
      <linearGradient id="ldmSteelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="25%" stop-color="#e2e8f0" />
        <stop offset="55%" stop-color="#64748b" />
        <stop offset="80%" stop-color="#94a3b8" />
        <stop offset="100%" stop-color="#334155" />
      </linearGradient>

      <!-- 2. Vàng kim loại 3D Metallic (Gold) -->
      <linearGradient id="ldmGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a" />
        <stop offset="35%" stop-color="#f59e0b" />
        <stop offset="70%" stop-color="#d97706" />
        <stop offset="100%" stop-color="#78350f" />
      </linearGradient>

      <!-- 3. Titanium mờ nhám 3D (Dark Titanium) -->
      <linearGradient id="ldmTitanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#cbd5e1" />
        <stop offset="40%" stop-color="#475569" />
        <stop offset="80%" stop-color="#1e293b" />
        <stop offset="100%" stop-color="#0f172a" />
      </linearGradient>

      <!-- 4. Đồng đỏ / Bronze 3D (Copper Metallic) -->
      <linearGradient id="ldmCopperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffedd5" />
        <stop offset="35%" stop-color="#fb923c" />
        <stop offset="70%" stop-color="#c2410c" />
        <stop offset="100%" stop-color="#7c2d12" />
      </linearGradient>
    </defs>

    <!-- Hào quang nhịp thở nền -->
    <circle class="ldm-halo-glow" cx="106" cy="76" r="75" fill="url(#ldmProfGlow)" />

    <!-- Vòng đường tròn khớp Pitch Circles mờ nghệ thuật -->
    <g stroke="#f59e0b" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.35" fill="none">
      <circle cx="82" cy="84" r="28.8" />
      <circle cx="131.3" cy="73.5" r="21.6" />
      <circle cx="96.8" cy="43.4" r="14.4" />
      <circle cx="148" cy="109.4" r="18" />
    </g>

    <!-- Hạt background -->
    <g class="ldm-particles-bg">
      @for (p of bgParticles; track $index) {
        <g [attr.transform]="'translate(' + (p.left * 1.8 + 10) + ',' + p.top + ') rotate(' + p.rotate + ') scale(' + (p.size / 5) + ')'">
          <polygon
            class="ldm-sparkle ldm-sparkle--bg"
            points="0,-3 0.9,-0.9 3,0 0.9,0.9 0,3 -0.9,0.9 -3,0 -0.9,-0.9"
            fill="#fcd34d"
            [style.opacity]="p.opacity * 0.5"
            [style.animation-duration.s]="p.duration"
            [style.animation-delay.s]="p.delay"
          />
        </g>
      }
    </g>
  </svg>

  <!-- Lớp 2: Cụm 4 Bánh Răng 3D Đan Khớp Hoàn Hảo (Module m = 3.6) -->
  <svg class="ldm-layer ldm-layer--mid" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <g class="ldm-gears-group">

      <!-- BÁNH RĂNG A: Thép Không Gỉ 16 Răng (Tâm 82, 84 | T=16s | CW) -->
      <g transform="translate(82, 84)">
        <g class="ldm-gear ldm-gear--a">
          <!-- 16 Răng ăn khớp chuẩn -->
          @for (a of [0, 22.5, 45, 67.5, 90, 112.5, 135, 157.5, 180, 202.5, 225, 247.5, 270, 292.5, 315, 337.5]; track a) {
            <path
              [attr.transform]="'rotate(' + a + ')'"
              d="M -3.2,-23.5 L -2.1,-32.4 C -2.0,-32.8 2.0,-32.8 2.1,-32.4 L 3.2,-23.5 Z"
              fill="url(#ldmSteelGrad)"
              stroke="#1e293b"
              stroke-width="0.8"
            />
          }
          <circle cx="0" cy="0" r="24.5" fill="url(#ldmSteelGrad)" stroke="#1e293b" stroke-width="1.2" />
          <circle cx="0" cy="0" r="19.5" fill="none" stroke="#f8fafc" stroke-width="0.8" opacity="0.6" />
          <circle cx="0" cy="0" r="15" fill="#0f172a" stroke="#475569" stroke-width="0.9" />
          @for (a of [0, 60, 120, 180, 240, 300]; track a) {
            <circle [attr.transform]="'rotate(' + a + ') translate(0, -10)'" cx="0" cy="0" r="3.2" fill="#cbd5e1" />
          }
          <!-- Tâm Ngôi Sao Vàng Tổ Quốc 3D -->
          <circle cx="0" cy="0" r="6" fill="#dc2626" stroke="#fbbf24" stroke-width="0.9" />
          <polygon points="0,-4.5 1.1,-1.4 4,-1.4 1.6,0.4 2.5,3.4 0,1.6 -2.5,3.4 -1.6,0.4 -4,-1.4 -1.1,-1.4" fill="#fef08a" />
        </g>
      </g>

      <!-- BÁNH RĂNG B: Vàng Kim Loại 12 Răng (Tâm 131.3, 73.5 | T=12s | CCW) -->
      <g transform="translate(131.3, 73.5)">
        <g transform="rotate(183)">
          <g class="ldm-gear ldm-gear--b">
            <!-- 12 Răng ăn khớp chuẩn -->
            @for (a of [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330]; track a) {
              <path
                [attr.transform]="'rotate(' + a + ')'"
                d="M -3.0,-17.5 L -1.9,-25.2 C -1.8,-25.6 1.8,-25.6 1.9,-25.2 L 3.0,-17.5 Z"
                fill="url(#ldmGoldGrad)"
                stroke="#451a03"
                stroke-width="0.8"
              />
            }
            <circle cx="0" cy="0" r="18.5" fill="url(#ldmGoldGrad)" stroke="#451a03" stroke-width="1.2" />
            <circle cx="0" cy="0" r="14.5" fill="none" stroke="#fef08a" stroke-width="0.8" opacity="0.7" />
            <circle cx="0" cy="0" r="10.5" fill="#1e293b" stroke="#78350f" stroke-width="0.9" />
            @for (a of [0, 90, 180, 270]; track a) {
              <circle [attr.transform]="'rotate(' + a + ') translate(0, -6.5)'" cx="0" cy="0" r="2.2" fill="#fde047" />
            }
            <circle cx="0" cy="0" r="4.5" fill="url(#ldmSteelGrad)" stroke="#1e293b" stroke-width="0.8" />
          </g>
        </g>
      </g>

      <!-- BÁNH RĂNG C: Titanium Mờ 8 Răng (Tâm 96.8, 43.4 | T=8s | CCW) -->
      <g transform="translate(96.8, 43.4)">
        <g transform="rotate(132.5)">
          <g class="ldm-gear ldm-gear--c">
            <!-- 8 Răng ăn khớp chuẩn -->
            @for (a of [0, 45, 90, 135, 180, 225, 270, 315]; track a) {
              <path
                [attr.transform]="'rotate(' + a + ')'"
                d="M -2.7,-11.5 L -1.7,-18.0 C -1.6,-18.4 1.6,-18.4 1.7,-18.0 L 2.7,-11.5 Z"
                fill="url(#ldmTitanGrad)"
                stroke="#0f172a"
                stroke-width="0.8"
              />
            }
            <circle cx="0" cy="0" r="12.5" fill="url(#ldmTitanGrad)" stroke="#0f172a" stroke-width="1.2" />
            <circle cx="0" cy="0" r="9" fill="none" stroke="#cbd5e1" stroke-width="0.8" opacity="0.5" />
            <circle cx="0" cy="0" r="6" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
            <circle cx="0" cy="0" r="3.5" fill="url(#ldmGoldGrad)" stroke="#451a03" stroke-width="0.6" />
          </g>
        </g>
      </g>

      <!-- BÁNH RĂNG D: Đồng Đỏ 10 Răng (Tâm 148, 109.4 | T=10s | CW) -->
      <g transform="translate(148, 109.4)">
        <g transform="rotate(263)">
          <g class="ldm-gear ldm-gear--d">
            <!-- 10 Răng ăn khớp chuẩn -->
            @for (a of [0, 36, 72, 108, 144, 180, 216, 252, 288, 324]; track a) {
              <path
                [attr.transform]="'rotate(' + a + ')'"
                d="M -2.8,-15.0 L -1.8,-21.6 C -1.7,-22.0 1.7,-22.0 1.8,-21.6 L 2.8,-15.0 Z"
                fill="url(#ldmCopperGrad)"
                stroke="#7c2d12"
                stroke-width="0.8"
              />
            }
            <circle cx="0" cy="0" r="16" fill="url(#ldmCopperGrad)" stroke="#7c2d12" stroke-width="1.2" />
            <circle cx="0" cy="0" r="12" fill="none" stroke="#ffedd5" stroke-width="0.8" opacity="0.6" />
            <circle cx="0" cy="0" r="8" fill="#1e293b" stroke="#7c2d12" stroke-width="0.8" />
            <circle cx="0" cy="0" r="3.8" fill="url(#ldmSteelGrad)" stroke="#1e293b" stroke-width="0.7" />
          </g>
        </g>
      </g>

    </g>

    <!-- Hạt mid -->
    <g class="ldm-particles-mid">
      @for (p of midParticles; track $index) {
        <g [attr.transform]="'translate(' + (p.left * 1.8 + 10) + ',' + p.top + ') rotate(' + p.rotate + ') scale(' + (p.size / 5) + ')'">
          <polygon
            class="ldm-sparkle ldm-sparkle--mid"
            points="0,-4 1.2,-1.2 4,0 1.2,1.2 0,4 -1.2,1.2 -4,0 -1.2,-1.2"
            fill="#fbbf24"
            [style.opacity]="p.opacity * 0.75"
            [style.animation-duration.s]="p.duration"
            [style.animation-delay.s]="p.delay"
          />
        </g>
      }
    </g>
  </svg>

  <!-- Lớp 3: Hạt bụi xưởng / tia lửa lấp lánh tiền cảnh -->
  <svg class="ldm-layer ldm-layer--fg" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <g class="ldm-particles-fg">
      @for (p of fgParticles; track $index) {
        <g [attr.transform]="'translate(' + (p.left * 1.8 + 10) + ',' + p.top + ') rotate(' + p.rotate + ') scale(' + (p.size / 5) + ')'">
          <polygon
            class="ldm-sparkle ldm-sparkle--fg"
            points="0,-5 1.5,-1.5 5,0 1.5,1.5 0,5 -1.5,1.5 -5,0 -1.5,-1.2"
            fill="#fef08a"
            [style.opacity]="p.opacity"
            [style.animation-duration.s]="p.duration"
            [style.animation-delay.s]="p.delay"
          />
        </g>
      }
    </g>
  </svg>
</div>
