<div class="ldm-scene">
  <!-- Lớp 1: Hào quang & Tia sáng xoay đằng sau -->
  <svg class="ldm-layer ldm-layer--bg" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs>
      <radialGradient id="ldmProfGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
        <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.25" />
        <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
      </radialGradient>
      
      <linearGradient id="ldmGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a" />
        <stop offset="40%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#d97706" />
      </linearGradient>

      <linearGradient id="ldmNonLaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef9c3" />
        <stop offset="60%" stop-color="#fde047" />
        <stop offset="100%" stop-color="#ca8a04" />
      </linearGradient>
    </defs>

    <!-- Hào quang nhịp thở -->
    <circle class="ldm-halo-glow" cx="100" cy="80" r="70" fill="url(#ldmProfGlow)" />

    <!-- Tia hào quang xoay tròn rực rỡ đằng sau -->
    <g class="ldm-halo-spin" transform="translate(100, 80)">
      <g opacity="0.4" fill="#f59e0b">
        <polygon points="0,0 -6,-85 6,-85" />
        <polygon points="0,0 -6,85 6,85" />
        <polygon points="0,0 -85,-6 -85,6" />
        <polygon points="0,0 85,-6 85,6" />
        <polygon points="0,0 -60,-60 -50,-68" />
        <polygon points="0,0 60,60 50,68" />
        <polygon points="0,0 -60,60 -68,50" />
        <polygon points="0,0 60,-60 68,-50" />
      </g>
    </g>
  </svg>

  <!-- Lớp 2: Cụm 5 Mũ Ngành Nghề Việt Nam nổi bật 100% -->
  <svg class="ldm-layer ldm-layer--mid" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <g class="ldm-professions-group">

      <!-- 1. MŨ BẢO HỘ CÔNG NHÂN / XÂY DỰNG (ĐỈNH CHÍNH GIỮA) -->
      <g class="ldm-hat ldm-hat--construction" transform="translate(100, 32)">
        <path d="M -22,6 C -22,-14 -14,-22 0,-22 C 14,-22 22,-14 22,6 Z" fill="url(#ldmGoldGrad)" stroke="#451a03" stroke-width="1.4" />
        <path d="M -27,8 C -15,13 15,13 27,8 C 29,12 24,15 0,15 C -24,15 -29,12 -27,8 Z" fill="url(#ldmGoldGrad)" stroke="#451a03" stroke-width="1.4" />
        <path d="M -3,-21 C -1,-22 1,-22 3,-21 L 2,10 C 1,11 -1,11 -2,10 Z" fill="#ffffff" opacity="0.75" />
        <polygon points="0,-4 1.5,-0.5 5,-0.5 2.2,1.2 3.2,4.8 0,2.5 -3.2,4.8 -2.2,1.2 -5,-0.5 -1.5,-0.5" fill="#ef4444" />
      </g>

      <!-- 2. NÓN LÁ VIỆT NAM / NÔNG DÂN (TRÁI TRÊN) -->
      <g class="ldm-hat ldm-hat--farmer" transform="translate(48, 58)">
        <polygon points="0,-22 28,10 -28,10" fill="url(#ldmNonLaGrad)" stroke="#713f12" stroke-width="1.4" />
        <path d="M -28,10 C -15,15 15,15 28,10 C 20,6 -20,6 -28,10 Z" fill="#fef08a" stroke="#713f12" stroke-width="1.2" />
        <path d="M -18,2 Q 0,7 18,2" stroke="#a16207" stroke-width="1" fill="none" />
        <path d="M -10,-8 Q 0,-4 10,-8" stroke="#a16207" stroke-width="1" fill="none" />
        <path d="M -12,11 Q 0,25 12,11" stroke="#dc2626" stroke-width="1.8" fill="none" />
      </g>

      <!-- 3. MŨ BÁC SĨ / Y TẾ (PHẢI TRÊN) -->
      <g class="ldm-hat ldm-hat--doctor" transform="translate(152, 58)">
        <path d="M -20,8 L -20,-8 C -10,-14 10,-14 20,-8 L 20,8 Z" fill="#ffffff" stroke="#475569" stroke-width="1.4" />
        <ellipse cx="0" cy="8" rx="20" ry="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.4" />
        <rect x="-3" y="-7" width="6" height="13" fill="#dc2626" rx="1" />
        <rect x="-6.5" y="-3.5" width="13" height="6" fill="#dc2626" rx="1" />
      </g>

      <!-- 4. MŨ CỬ NHÂN / TRI THỨC GIÁO DỤC (TRÁI DƯỚI) -->
      <g class="ldm-hat ldm-hat--academic" transform="translate(58, 114)">
        <path d="M -14,2 L -14,10 C -7,14 7,14 14,10 L 14,2 Z" fill="#334155" stroke="#0f172a" stroke-width="1.2" />
        <polygon points="0,-11 26,-2 0,7 -26,-2" fill="#0f172a" stroke="#475569" stroke-width="1.4" />
        <path d="M 0,-2 L 16,3 L 16,13" stroke="#fbbf24" stroke-width="1.5" fill="none" />
        <circle cx="16" cy="14" r="2.5" fill="#f59e0b" />
      </g>

      <!-- 5. MŨ KĨ THUẬT / CÔNG NGHỆ (PHẢI DƯỚI) -->
      <g class="ldm-hat ldm-hat--tech" transform="translate(142, 114)">
        <path d="M -20,6 C -20,-12 -12,-18 0,-18 C 12,-18 20,-12 20,6 Z" fill="#0284c7" stroke="#0c4a6e" stroke-width="1.4" />
        <path d="M -24,7 C -14,12 14,12 24,7 C 26,10 20,13 0,13 C -20,13 -26,10 -24,7 Z" fill="#38bdf8" stroke="#0c4a6e" stroke-width="1.4" />
        <path d="M -20,1 C -26,-9 26,-9 20,1" fill="none" stroke="#64748b" stroke-width="2" />
        <rect x="-23" y="-2" width="5" height="9" rx="1.5" fill="#1e293b" />
        <rect x="18" y="-2" width="5" height="9" rx="1.5" fill="#1e293b" />
      </g>

      <!-- TÂM BIỂU TƯỢNG: NGÔI SAO VÀNG TỔ QUỐC RỰC RỠ CHÍNH GIỮA -->
      <g class="ldm-center-star" transform="translate(100, 80)">
        <circle cx="0" cy="0" r="22" fill="#dc2626" stroke="#fbbf24" stroke-width="1.8" filter="drop-shadow(0 3px 8px rgba(0,0,0,0.4))" />
        <polygon points="0,-13 3.8,-3.8 13,-3.8 5.6,1.8 8.4,11 0,4.8 -8.4,11 -5.6,1.8 -13,-3.8 -3.8,-3.8" fill="#fef08a" stroke="#b45309" stroke-width="0.8" />
      </g>

    </g>
  </svg>

  <!-- Lớp 3: Hạt lấp lánh -->
  <svg class="ldm-layer ldm-layer--fg" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    @for (p of midParticles; track $index) {
      <polygon
        class="ldm-sparkle"
        points="0,-4 1.2,-1.2 4,0 1.2,1.2 0,4 -1.2,1.2 -4,0 -1.2,-1.2"
        fill="#fbbf24"
        [attr.transform]="'translate(' + (p.left * 1.8 + 10) + ',' + p.top + ') scale(' + (p.size / 6) + ')'"
        [style.opacity]="p.opacity * 0.8"
        [style.animation-duration.s]="p.duration"
        [style.animation-delay.s]="p.delay"
      />
    }
  </svg>
</div>
