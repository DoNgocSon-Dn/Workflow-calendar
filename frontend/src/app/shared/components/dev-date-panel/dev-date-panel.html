@if (canUse()) {
  <div class="dev-date-panel" [class.dev-date-panel--flagged]="activeOverrideLabel()">
    @if (open()) {
      <div class="dev-date-panel__card" role="group" aria-label="Giả lập ngày (chỉ dev)">
        <p class="dev-date-panel__title">🛠 Giả lập "hôm nay"</p>
        @if (activeOverrideLabel(); as label) {
          <p class="dev-date-panel__status">Đang giả lập: <strong>{{ label }}</strong></p>
        } @else {
          <p class="dev-date-panel__status dev-date-panel__status--real">Đang dùng ngày thật của máy</p>
        }
        <input
          type="date"
          class="dev-date-panel__input"
          [value]="draftDate()"
          (input)="onDraftChange($any($event.target).value)"
        />
        <div class="dev-date-panel__actions">
          <button type="button" class="dev-date-panel__btn dev-date-panel__btn--primary" (click)="apply()">
            Áp dụng (reload trang)
          </button>
          <button type="button" class="dev-date-panel__btn" (click)="simulateBirthday()">
            🎂 Giả lập Sinh nhật
          </button>
          <button type="button" class="dev-date-panel__btn" (click)="reset()">
            Về ngày thật
          </button>
        </div>
      </div>
    }
    <button
      type="button"
      class="dev-date-panel__toggle"
      (click)="toggleOpen()"
      [attr.aria-expanded]="open()"
      aria-label="Bật/tắt bảng giả lập ngày (dev)"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </button>
  </div>
}
