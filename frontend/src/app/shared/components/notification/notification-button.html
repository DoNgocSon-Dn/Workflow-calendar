<div class="notif-menu">
  <button
    type="button"
    class="notif-icon-btn"
    [class.notif-icon-btn--pulsing]="pulsing()"
    aria-label="Thông báo"
    aria-haspopup="true"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path
        fill="currentColor"
        d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1z"
      />
    </svg>
    @if (badgeLabel(); as label) {
      <span class="notif-icon-btn__badge">{{ label }}</span>
    }
  </button>

  @if (open()) {
    <div class="notif-menu__backdrop" (click)="closePanel()"></div>
    <app-notification-panel
      (close)="closePanel()"
      (openEvent)="onOpenEvent($event)"
      (openGroup)="onOpenGroup($event)"
    />
  }
</div>
