<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Workflow</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="favicon.svg">

  <!-- PWA & Mobile Standalone (Tương tự Google Calendar) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lịch">

  <!-- Trang landing là cửa vào công khai của sản phẩm. Không có mô tả và thẻ
       Open Graph thì link dán vào Zalo/Messenger/Facebook ra một ô trống —
       mất trắng phần lớn giá trị của việc được chia sẻ. -->
  <meta name="description" content="Lịch cá nhân và nhóm với trợ lý AI hiểu tiếng Việt: gõ một câu là có sự kiện, tự phát hiện trùng giờ, đồng bộ real-time, sẵn ngày âm và ngày lễ Việt Nam. Miễn phí, đăng nhập bằng Google.">
  <meta name="theme-color" content="#0f1117">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Workflow">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:title" content="Workflow — Lịch thông minh có trợ lý AI hiểu tiếng Việt">
  <meta property="og:description" content="Gõ một câu là có sự kiện. Tự phát hiện trùng giờ, đồng bộ real-time, sẵn ngày âm và ngày lễ Việt Nam. Miễn phí, đăng nhập bằng Google.">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Workflow — Lịch thông minh có trợ lý AI hiểu tiếng Việt">
  <meta name="twitter:description" content="Gõ một câu là có sự kiện. Tự phát hiện trùng giờ, đồng bộ real-time, sẵn ngày âm và ngày lễ Việt Nam.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Chỉ tải các weight thật sự được dùng trong CSS (500/600/700/800 + 400
       mặc định). Bản cũ xin cả 300 và 900 cùng hai kiểu nghiêng của Be Vietnam
       Pro — không chỗ nào trong dự án khai báo chúng.

       Nạp KHÔNG chặn render: `media="print"` khiến trình duyệt tải nhưng không
       chờ, `onload` đổi lại `all` khi xong. Thiếu bước này, mạng chậm hoặc
       fonts.googleapis.com bị chặn (trình duyệt in-app) là cả trang — kể cả
       màn hình chờ — đứng im màu đen cho tới lúc file CSS font về. -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Kalam:wght@400;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    media="print"
    onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  </noscript>

  <!-- CHỐNG NHÁY SÁNG: chọn sáng/tối NGAY trước khi trang vẽ — theo lựa chọn đã
       lưu, hoặc theo cài đặt của thiết bị nếu người dùng chưa chọn gì. -->
  <script>
    (function () {
      try {
        var app = localStorage.getItem('theme');          // light | dark | system
        var pub = localStorage.getItem('workflow-theme');  // light | dark  (landing/login)
        var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        var dark;
        if (app === 'light' || app === 'dark') dark = app === 'dark';
        else if (pub === 'light' || pub === 'dark') dark = pub === 'dark';
        else dark = !!(mq && mq.matches);
        var r = document.documentElement;
        r.classList.toggle('dark', dark);
        r.setAttribute('data-theme', dark ? 'dark' : 'light');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#0f1117' : '#ffffff');
      } catch (e) {}
    })();
  </script>

  <style>
    /* Nền trang trước khi CSS ứng dụng kịp nạp — hết cảnh "trắng ngắt". */
    html { background: #ffffff; }
    html.dark { background: #0f1117; }

    /* Màn hình chờ — KHÔNG phụ thuộc CSS ứng dụng hay Google Fonts: màu đặt
       cứng, font hệ thống. main.ts / script bên dưới tự cập nhật tiến độ và tự
       gỡ khi Angular dựng xong. */
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      background: #ffffff;
      color: #1b1c28;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      opacity: 1;
      transition: opacity 0.38s ease;
    }
    html.dark #app-splash { background: #0f1117; color: #e9eaf0; }
    #app-splash.app-splash--hide { opacity: 0; pointer-events: none; }

    .app-splash__mark {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #4a83ff, #2f6bff);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 32px;
      letter-spacing: -0.02em;
      box-shadow: 0 12px 34px rgba(47, 107, 255, 0.4);
      animation: appSplashPulse 1.8s ease-in-out infinite;
    }
    @keyframes appSplashPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .app-splash__name {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.01em;
      opacity: 0.92;
    }

    /* Thanh tiến độ: chiều rộng nhảy theo các mốc THẬT (xem script), còn lớp
       gradient chạy ngang để không bao giờ trông như bị đứng. */
    .app-splash__bar {
      position: relative;
      width: 190px;
      max-width: 62vw;
      height: 4px;
      border-radius: 99px;
      background: rgba(128, 128, 128, 0.22);
      overflow: hidden;
    }
    .app-splash__fill {
      height: 100%;
      width: 10%;
      border-radius: 99px;
      background: linear-gradient(90deg, #2f6bff, #6ea0ff, #2f6bff);
      background-size: 200% 100%;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      animation: appSplashSlide 1.4s linear infinite;
    }
    @keyframes appSplashSlide {
      to { background-position: -200% 0; }
    }

    .app-splash__status {
      font-size: 12.5px;
      line-height: 1.4;
      opacity: 0.62;
      min-height: 1.4em;
      text-align: center;
      max-width: 260px;
    }
    .app-splash__retry {
      display: none;
      margin-top: 2px;
      padding: 9px 20px;
      border: 0;
      border-radius: 10px;
      background: #2f6bff;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #app-splash.is-slow .app-splash__retry { display: inline-block; }

    @media (prefers-reduced-motion: reduce) {
      .app-splash__mark,
      .app-splash__fill { animation: none; }
      #app-splash { transition: none; }
    }
  </style>
</head>
<body>
  <div id="app-splash" role="status" aria-live="polite">
    <div class="app-splash__mark">W</div>
    <div class="app-splash__name">Workflow</div>
    <div class="app-splash__bar"><div class="app-splash__fill" id="app-splash-fill"></div></div>
    <div class="app-splash__status" id="app-splash-status">Đang tải…</div>
    <button type="button" class="app-splash__retry" onclick="location.reload()">Tải lại</button>
  </div>

  <app-root></app-root>

  <script>
    /* Tiến độ tải: các mốc THẬT (parse HTML → tải xong tài nguyên → Angular
       khởi động → dựng xong). Giữa các mốc có thông báo trấn an theo thời gian
       để người dùng biết app chưa "chết", và nút Tải lại hiện nếu quá lâu. */
    (function () {
      var fill = document.getElementById('app-splash-fill');
      var statusEl = document.getElementById('app-splash-status');
      var splash = document.getElementById('app-splash');
      var pct = 12;
      var finished = false;

      function now() { return pct; }
      function set(target, msg) {
        if (finished) return;
        if (target > pct) { pct = target; if (fill) fill.style.width = pct + '%'; }
        if (msg && statusEl) statusEl.textContent = msg;
      }

      // API cho main.ts.
      window.__appSplash = {
        set: set,
        fail: function (msg) {
          finished = true;
          if (splash) splash.classList.add('is-slow');
          if (statusEl) statusEl.textContent = msg || 'Không tải được ứng dụng. Kiểm tra mạng rồi thử lại.';
          if (fill) fill.style.animationPlayState = 'paused';
        },
        done: function () {
          finished = true;
          if (fill) fill.style.width = '100%';
          if (statusEl) statusEl.textContent = 'Xong!';
        },
      };

      set(12, 'Đang tải…');
      document.addEventListener('DOMContentLoaded', function () { set(38, 'Đang tải giao diện…'); });
      window.addEventListener('load', function () { set(62, 'Đang khởi động…'); });

      setTimeout(function () { set(Math.max(now(), 30), 'Đang tải giao diện…'); }, 2000);
      setTimeout(function () {
        if (!finished) set(Math.max(now(), 70), 'Máy chủ đang khởi động lại, đợi chút…');
      }, 7000);
      setTimeout(function () {
        if (!finished && splash) {
          splash.classList.add('is-slow');
          if (statusEl) statusEl.textContent = 'Tải lâu hơn bình thường. Thử tải lại nếu chờ quá lâu.';
        }
      }, 18000);
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
