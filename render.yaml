# Render Blueprint — deploy backend NestJS (cổng động qua $PORT).
#
# Cách dùng:
#   1. Đẩy repo này lên GitHub (nhánh master).
#   2. Render Dashboard → New → Blueprint → chọn repo Workflow-calendar.
#   3. Render đọc file này, tạo service "workflow-calendar-api".
#   4. Điền các biến môi trường bên dưới (sync:false = phải nhập tay, là secret).
#   5. Sau khi có URL (vd https://workflow-calendar-api.onrender.com):
#        - đặt biến API_BASE_URL = chính URL đó (cho link trong email mời).
#        - bên Vercel: đặt API_URL = URL đó.
#        - Supabase → Auth → URL Configuration: thêm domain Vercel.
#
# Lưu ý gói Free của Render: service ngủ sau ~15 phút không có request,
# lần gọi kế tiếp mất ~30-50s để dậy. Chấp nhận được cho app cá nhân.

services:
  - type: web
    name: workflow-calendar-api
    runtime: node
    plan: free
    rootDir: backend
    # Render đặt NODE_ENV=production → npm ci mặc định bỏ devDependencies,
    # nhưng @nestjs/cli + typescript nằm ở đó nên cần --include=dev để build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # --- Supabase ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # --- URL công khai của CHÍNH service này (điền sau khi có domain Render) ---
      - key: API_BASE_URL
        sync: false
      # CORS: backend đang enableCors({ origin: true }) nên để trống cũng được;
      # đặt = domain Vercel nếu sau này siết lại.
      - key: CORS_ORIGIN
        sync: false
      # --- Gmail (gửi lời mời + .ics) ---
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      # --- AI (Gemini) ---
      - key: GEMINI_API_KEY
        sync: false
      # --- Web Push (VAPID) ---
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # --- Token bảo vệ endpoint thông báo hệ thống (để trống = tắt) ---
      - key: SYSTEM_NOTIFICATION_TOKEN
        sync: false
